# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=nearme_dev_2024
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (dev only — disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA — create-drop ensures clean schema on each restart
spring.jpa.hibernate.ddl-auto=create-drop

# CORS — override in production via environment variable
app.cors.allowed-origins=http://localhost:3000

# Jackson — serialize dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.example.demo=INFO