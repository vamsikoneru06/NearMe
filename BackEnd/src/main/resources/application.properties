# Load local secret overrides (gitignored file — holds API keys)
spring.config.import=optional:classpath:application-local.properties

# ─── Database (H2 for dev — override with DB_URL/DB_USER/DB_PASS for MySQL) ───
spring.datasource.url=${DB_URL:jdbc:h2:mem:nearme}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:nearme_dev_2024}
# Dialect is auto-detected by Hibernate 6 — no need to set explicitly

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson — ISO date strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.secret=${JWT_SECRET:change-this-in-production-min-32-chars!!}
jwt.expiration=${JWT_EXPIRY:86400000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Google Places API — set GOOGLE_PLACES_KEY in application-local.properties (gitignored)
google.places.api.key=${GOOGLE_PLACES_KEY:}

# Server
server.port=8080

# Logging
logging.level.com.nearme=INFO
